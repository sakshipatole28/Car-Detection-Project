[project]
name = "cardet"
version = "2.0.0"
description = "Side-view car detection on the UIUC dataset: HOG + calibrated linear model, MLflow, DVC, FastAPI, BentoML."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sakshi Patole" }]

[tool.setuptools]
packages = ["cardet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["exp11", "CarData"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's File(...)/Query(...) defaults
