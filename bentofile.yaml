# BentoML build config:  python -m cardet.bento_export && bentoml build
service: "service:CarDetectorService"
name: car_detector_service
labels:
  owner: sakshipatole28
  project: car-detection
description: "file: ./README.md"
include:
  - "service.py"
  - "cardet/*.py"
  - "README.md"
python:
  requirements_txt: "./requirements-serve-bento.txt"
  lock_packages: false
docker:
  python_version: "3.11"
