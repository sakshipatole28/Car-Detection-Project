<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Car Detector{% endblock %}</title>
  <script>
    // Apply the saved theme before first paint (no light/dark flash).
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='30' width='84' height='40' rx='8' fill='none' stroke='%23ff4338' stroke-width='10'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body class="page-{{ page }}">
  <div class="bg" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
    <span class="streak s1"></span><span class="streak s2"></span><span class="streak s3"></span>
    <span class="streak s4"></span><span class="streak s5"></span>
  </div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        CAR<span>DETECTOR</span>
      </a>
      <div class="topbar-right">
        <nav aria-label="Main">
          <a href="/" {% if page == 'detect' %}aria-current="page"{% endif %}>Detect</a>
          <a href="/dashboard" {% if page == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
          <a href="/about" {% if page == 'about' %}aria-current="page"{% endif %}>About</a>
          <a href="/docs">API</a>
        </nav>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch light or dark theme" title="Switch theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    UIUC Car Dataset · HOG + calibrated linear model · FastAPI · MLflow · DVC · BentoML
  </footer>

  <script src="{{ url_for('static', path='theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
